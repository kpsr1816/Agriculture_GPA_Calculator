<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGPA Calculator</title>

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: linear-gradient(-45deg, #f5f7f6, #eef6f1, #f0f9f4);
  background-size: 300% 300%;
  animation: bgShift 45s ease infinite;
}

@keyframes bgShift {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

header {
  text-align: center;
  padding: 20px;
  background: white;
  border-bottom: 1px solid #ddd;
}

.main {
  display: grid;
  grid-template-columns: 1fr;
  padding: 20px;
}

.card {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.05);
}

.sem-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  margin-bottom: 10px;
}

input {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.primary { background: #16a34a; color: white; }
.secondary { background: #ddd; }
.danger { background: #dc2626; color: white; }

.result {
  font-size: 1.3rem;
  margin-top: 10px;
}

</style>
</head>

<body>

<header>
<h1>OGPA Calculator</h1>
</header>

<div class="main">
<div class="card">

<h3>Semesters</h3>

<div id="semesters"></div>

<button class="secondary" onclick="addSemester()">+ Add Semester</button>
<button class="primary" onclick="calculate()">Calculate OGPA</button>

<div id="result" class="result"></div>

<canvas id="chart" style="margin-top:20px;"></canvas>

<button class="secondary" onclick="saveData()">Save</button>
<button class="secondary" onclick="loadData()">Load</button>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let count = 0;
let chart;

/* ADD */
function addSemester(){
  count++;

  const row = document.createElement("div");
  row.className = "sem-row";
  row.id = "sem"+count;

  row.innerHTML = `
    <input type="number" id="gpa${count}" placeholder="GPA">
    <input type="number" id="credit${count}" placeholder="Credits">
    <button class="danger" onclick="removeSemester(${count})">X</button>
  `;

  document.getElementById("semesters").appendChild(row);
}

/* REMOVE */
function removeSemester(id){
  document.getElementById("sem"+id)?.remove();
}

/* INIT */
addSemester();

/* CALCULATE */
function calculate(){

  let totalC=0,totalP=0;
  let labels=[],values=[];

  for(let i=1;i<=count;i++){
    let row=document.getElementById("sem"+i);
    if(row){
      let g=parseFloat(document.getElementById("gpa"+i).value);
      let c=parseFloat(document.getElementById("credit"+i).value);

      if(!isNaN(g) && !isNaN(c)){
        totalC+=c;
        totalP+=g*c;

        labels.push("Sem "+i);
        values.push(g);
      }
    }
  }

  if(totalC===0){
    alert("Enter valid data");
    return;
  }

  let ogpa = totalP/totalC;

  document.getElementById("result").innerText =
    "OGPA: "+ogpa.toFixed(2);

  /* CHART */
  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels:labels,
      datasets:[{
        label:"Semester GPA",
        data:values,
        tension:0.3
      }]
    }
  });

}

/* SAVE */
function saveData(){
  let data=[];

  for(let i=1;i<=count;i++){
    let row=document.getElementById("sem"+i);
    if(row){
      data.push({
        g:document.getElementById("gpa"+i).value,
        c:document.getElementById("credit"+i).value
      });
    }
  }

  localStorage.setItem("ogpaData",JSON.stringify(data));
}

/* LOAD */
function loadData(){
  let data=JSON.parse(localStorage.getItem("ogpaData"));
  if(!data) return;

  document.getElementById("semesters").innerHTML="";
  count=0;

  data.forEach(d=>{
    count++;

    document.getElementById("semesters").innerHTML+=`
      <div class="sem-row" id="sem${count}">
        <input type="number" id="gpa${count}" value="${d.g}">
        <input type="number" id="credit${count}" value="${d.c}">
        <button class="danger" onclick="removeSemester(${count})">X</button>
      </div>
    `;
  });
}

</script>

</body>
</html>
