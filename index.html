<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agriculture GPA Calculator</title>

<style>
/* ===== BACKGROUND (SUBTLE ANIMATION) ===== */
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(-45deg, #e8f5e9, #f1f8e9, #e3f2fd, #f9fbe7);
  background-size: 300% 300%;
  animation: gradientBG 12s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== MAIN CARD ===== */
.container {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  animation: fadeIn 1s ease;
}

/* ===== FADE IN ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px);}
  to { opacity: 1; transform: translateY(0);}
}

/* ===== HEADER ===== */
h1 {
  font-size: 2.2rem;
  color: #2e7d32;
  margin-bottom: 10px;
}

/* ===== INTRO TEXT ===== */
.intro {
  font-size: 1rem;
  color: #555;
  margin-bottom: 25px;
}

/* ===== BUTTON GROUP ===== */
.buttons {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* ===== BUTTON STYLE ===== */
.button {
  padding: 14px;
  border-radius: 12px;
  background: #2e7d32;
  color: white;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.button:hover {
  background: #1b5e20;
  transform: translateY(-3px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

/* ===== FLOAT BUTTONS ===== */
.bottom-right-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: #1976d2;
  padding: 10px 18px;
  border-radius: 25px;
  color: white;
  font-size: 0.9rem;
  text-decoration: none;
  transition: 0.3s;
}

.bottom-right-button:hover {
  background-color: #0d47a1;
}

/* Chat button */
.agri-chat-button {
  bottom: 70px;
  background-color: #2e7d32;
}

.agri-chat-button:hover {
  background-color: #1b5e20;
}

/* ===== CHAT POPUP ===== */
#chatPopup {
  display: none;
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 300px;
  height: 400px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  overflow: hidden;
}

#chatPopupHeader {
  background-color: #2e7d32;
  color: white;
  padding: 10px;
  text-align: center;
  font-weight: bold;
}

#chatBody {
  padding: 10px;
  height: 280px;
  overflow-y: auto;
}

.user-message, .ai-message {
  padding: 8px;
  border-radius: 10px;
  margin: 5px 0;
}

.user-message {
  background: #f1f1f1;
  text-align: right;
}

.ai-message {
  background: #2e7d32;
  color: white;
}

/* INPUT */
#chatInput {
  display: flex;
}

#chatInput input {
  width: 70%;
  padding: 8px;
}

#chatInput button {
  width: 30%;
  background: #2e7d32;
  color: white;
  border: none;
}

</style>
</head>

<body>

<div class="container">
  <h1>Agriculture GPA Calculator</h1>

  <div class="intro">
    Smart academic tool for agricultural students to calculate GPA and OGPA efficiently.
  </div>

  <div class="buttons">
    <a href="semester_gpa.html" class="button">Semester GPA</a>
    <a href="cumulative_gpa.html" class="button">Cumulative OGPA</a>
  </div>
</div>

<!-- Feedback -->
<a href="https://forms.gle/aZ2V2XqT93gaFpVq6" class="bottom-right-button">Feedback</a>

<!-- Chat Button -->
<button class="bottom-right-button agri-chat-button" onclick="toggleChatPopup()">AgriChatGPT</button>

<!-- Chat Popup -->
<div id="chatPopup">
  <div id="chatPopupHeader">
    AgriChatGPT
    <span style="float:right;cursor:pointer" onclick="toggleChatPopup()">×</span>
  </div>

  <div id="chatBody">
    <div class="ai-message">Hello! How can I help you?</div>
  </div>

  <div id="chatInput">
    <input type="text" id="userInput">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
function toggleChatPopup() {
  const chatPopup = document.getElementById("chatPopup");
  chatPopup.style.display = chatPopup.style.display === "block" ? "none" : "block";
}

function sendMessage() {
  let input = document.getElementById("userInput");
  if (input.value.trim() === "") return;

  let msg = document.createElement("div");
  msg.className = "user-message";
  msg.innerText = input.value;
  document.getElementById("chatBody").appendChild(msg);

  input.value = "";

  setTimeout(() => {
    let reply = document.createElement("div");
    reply.className = "ai-message";
    reply.innerText = "Response coming soon...";
    document.getElementById("chatBody").appendChild(reply);
  }, 800);
}
</script>

</body>
</html>
