<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agri GPA System</title>

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: linear-gradient(-45deg, #f5f7f6, #eef6f1, #f0f9f4);
  background-size: 300% 300%;
  animation: bgShift 45s ease infinite;
}

@keyframes bgShift {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

header {
  text-align: center;
  padding: 20px;
  background: white;
  border-bottom: 1px solid #ddd;
}

.main {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.05);
}

.course-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  margin-bottom: 10px;
}

input {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 8px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.primary { background: #16a34a; color: white; }
.secondary { background: #ddd; }
.danger { background: #dc2626; color: white; }

.result {
  font-size: 1.4rem;
  margin-top: 10px;
}

.insight {
  background: #ecfdf5;
  padding: 8px;
  margin-top: 8px;
  border-left: 4px solid #16a34a;
}

@media(max-width:900px){
  .main { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
<h1>Agriculture GPA Intelligence System</h1>
</header>

<div class="main">

<!-- LEFT -->
<div class="card">
<h3>Courses</h3>

<div id="courses"></div>

<button class="secondary" onclick="addCourse()">+ Add Course</button>
<button class="primary" onclick="calculate()">Calculate GPA</button>

<div id="result" class="result"></div>
<canvas id="chart"></canvas>

</div>

<!-- RIGHT -->
<div class="card">

<h3>Target GPA</h3>
<input type="number" id="target" placeholder="Enter target GPA">
<button class="primary" onclick="predict()">Predict Required GPA</button>

<div id="prediction" class="insight"></div>

<h3>Insights</h3>
<div id="insights"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let count = 0;
let chart;
let lastData = null;

/* ADD COURSE */
function addCourse(){
  count++;

  const row = document.createElement("div");
  row.className = "course-row";
  row.id = "course"+count;

  row.innerHTML = `
    <input type="number" id="marks${count}" placeholder="Marks (%)">
    <input type="number" id="credit${count}" placeholder="Credits">
    <button class="danger" onclick="removeCourse(${count})">X</button>
  `;

  document.getElementById("courses").appendChild(row);
}

/* REMOVE COURSE */
function removeCourse(id){
  document.getElementById("course"+id)?.remove();
}

/* INIT */
addCourse();

/* CALCULATE */
function calculate(){

  let totalC=0,totalP=0;
  let labels=[],values=[],impacts=[];
  let courses=0;

  for(let i=1;i<=count;i++){
    let row=document.getElementById("course"+i);
    if(row){
      let m=parseFloat(document.getElementById("marks"+i).value);
      let c=parseFloat(document.getElementById("credit"+i).value);

      if(!isNaN(m) && !isNaN(c)){
        let gp=m/10;
        totalC+=c;
        totalP+=gp*c;

        labels.push("C"+i);
        values.push(gp);
        impacts.push(gp*c);
        courses++;
      }
    }
  }

  if(totalC===0){
    alert("Enter valid data");
    return;
  }

  let gpa = totalP/totalC;

  lastData = {totalC,totalP,courses};

  document.getElementById("result").innerText="GPA: "+gpa.toFixed(2);
  document.getElementById("prediction").innerText="";

  /* CHART */
  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels:labels,
      datasets:[{
        label:"Grade Points",
        data:values
      }]
    },
    options:{
      scales:{ y:{ beginAtZero:true, max:10 }}
    }
  });

  /* INSIGHTS */
  let maxIndex = impacts.indexOf(Math.max(...impacts))+1;
  let minIndex = impacts.indexOf(Math.min(...impacts))+1;

  document.getElementById("insights").innerHTML=`
    <div class="insight">Highest contributor: Course ${maxIndex}</div>
    <div class="insight">Weakest course: Course ${minIndex}</div>
  `;
}

/* PREDICT (MATHEMATICAL) */
function predict(){

  if(!lastData){
    alert("Calculate GPA first");
    return;
  }

  let target=parseFloat(document.getElementById("target").value);

  if(isNaN(target)){
    alert("Enter target GPA");
    return;
  }

  let {totalC,totalP,courses} = lastData;

  let futureCourses = 1; // assume next course
  let futureCredits = totalC / courses;

  let requiredGP =
    (target*(totalC+futureCredits) - totalP) / futureCredits;

  if(requiredGP > 10){
    document.getElementById("prediction").innerText =
      "Target too high. Not realistically achievable.";
  } else if(requiredGP < 0){
    document.getElementById("prediction").innerText =
      "Target already achieved.";
  } else {
    document.getElementById("prediction").innerText =
      "You need average GPA of " + requiredGP.toFixed(2) +
      " in upcoming course.";
  }
}

</script>

</body>
</html>
