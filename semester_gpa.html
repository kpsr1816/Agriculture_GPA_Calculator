<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester GPA Calculator</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: linear-gradient(-45deg, #e8f5e9, #f1f8e9, #e3f2fd, #f9fbe7);
  background-size: 300% 300%;
  animation: gradientBG 20s ease infinite;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

header {
  text-align: center;
  padding: 20px;
  color: #2e7d32;
}

.intro {
  text-align: center;
  color: #555;
  margin-bottom: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 30px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.form-group {
  margin-bottom: 20px;
}

label {
  font-weight: 600;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  margin-top: 10px;
}

.primary-btn {
  background: #2e7d32;
  color: white;
}

.secondary-btn {
  background: #e0e0e0;
}

.remove-button {
  background: #dc3545;
  color: white;
}

.result {
  margin-top: 20px;
  font-size: 1.3rem;
  font-weight: bold;
  text-align: center;
  color: #2e7d32;
}

footer {
  text-align: center;
  padding: 15px;
  font-size: 0.85rem;
  color: #777;
  margin-top: auto;
}
</style>
</head>

<body>

<header>
  <h1>Semester GPA Calculator</h1>
</header>

<div class="intro">
  Enter marks and credits to calculate your GPA
</div>

<div class="container">

<form id="gpa-form">
  <div id="courses">
    <div class="form-group" id="course1">
      <label>Course 1 Marks (%)</label>
      <input type="number" id="marks1" required>

      <label>Course 1 Credit Hours</label>
      <input type="number" id="credit1" required>
    </div>
  </div>

  <button type="button" class="secondary-btn" onclick="addCourse()">+ Add Course</button>
  <button type="submit" class="primary-btn">Calculate GPA</button>
</form>

<div class="result" id="result"></div>

<canvas id="gpaChart" style="margin-top:20px;"></canvas>

</div>

<footer>
  Developed by Sabari
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let courseCount = 1;
let chart;

function addCourse() {
  courseCount++;
  const div = document.getElementById("courses");

  div.insertAdjacentHTML("beforeend", `
    <div class="form-group" id="course${courseCount}">
      <label>Course ${courseCount} Marks (%)</label>
      <input type="number" id="marks${courseCount}" required>

      <label>Course ${courseCount} Credit Hours</label>
      <input type="number" id="credit${courseCount}" required>

      <button type="button" class="remove-button" onclick="removeCourse(${courseCount})">Remove</button>
    </div>
  `);
}

function removeCourse(id) {
  document.getElementById("course" + id)?.remove();
}

document.getElementById("gpa-form").addEventListener("submit", function(e) {
  e.preventDefault();

  let totalCredits = 0;
  let totalPoints = 0;
  let labels = [];
  let values = [];

  for (let i = 1; i <= courseCount; i++) {
    const c = document.getElementById("course" + i);
    if (c) {
      const marks = parseFloat(document.getElementById("marks" + i).value);
      const credit = parseFloat(document.getElementById("credit" + i).value);

      let gp = marks / 10;

      totalCredits += credit;
      totalPoints += gp * credit;

      labels.push("Course " + i);
      values.push(gp);
    }
  }

  const gpa = totalPoints / totalCredits;
  document.getElementById("result").innerText = "GPA: " + gpa.toFixed(2);

  const ctx = document.getElementById("gpaChart").getContext("2d");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "Grade Points",
        data: values
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true,
          max: 10
        }
      }
    }
  });
});
</script>

</body>
</html>
